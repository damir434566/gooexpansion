<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Air Jordan 4 Retro 'Bred Reimagined' | GOAT</title>
<style>
  .cell { display: inline-block; width: 90px; margin: 4px; border: 1px solid #ccc; }
  .cell div { display: block; }
</style>
</head>
<body>
  <main>
    <h1>Air Jordan 4 Retro 'Bred Reimagined'</h1>
    <p>FV5029 006</p>
    <!-- Every size is a tile with its own price, the size on one line and the
         price on the next. The page states no price in its markup. -->
    <div data-testid="size-picker" aria-label="Select size">
      <div data-testid="grid-cell-price" class="cell"><div>18</div><div>$215</div></div>
      <div data-testid="grid-cell-price" class="cell"><div>4</div><div>$240</div></div>
      <div data-testid="grid-cell-price" class="cell"><div>10.5</div><div>$231</div></div>
    </div>
    <section class="buy-box">
      <div class="product-price">$199</div>
      <button>Buy New</button>
    </section>
  </main>
</body>
</html>
