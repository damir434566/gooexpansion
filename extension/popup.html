<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Goo Collect</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Goo Collect</h1>
      <p class="sub" id="store">Reading this tab…</p>
    </header>

    <section class="rows">
      <label class="row check" for="all">
        <span>
          Everything on this page
          <small>Scrolls this tab to the end, presses "Show more" and goes through every page of the listing first.</small>
        </span>
        <input id="all" type="checkbox" checked />
      </label>

      <label class="row" for="limit" id="limitRow">
        <span>Or only the first</span>
        <input id="limit" type="number" min="1" max="2000" value="30" />
      </label>

      <label class="row check" for="linksOnly">
        <span>
          Links only
          <small>Only add this store's link to pieces we already have. Nothing new is created.</small>
        </span>
        <input id="linksOnly" type="checkbox" />
      </label>

      <label class="row" for="studio">
        <span>Goo Studio</span>
        <input id="studio" type="url" spellcheck="false" placeholder="https://www.goo-fashion.com" />
      </label>
    </section>

    <div class="actions">
      <button id="start" class="primary">Collect this page</button>
      <button id="stop" class="ghost" hidden>Stop</button>
    </div>

    <section id="progress" class="progress" hidden>
      <div class="bar"><div id="fill"></div></div>
      <p class="found" id="found" hidden></p>
      <p class="counts">
        <strong id="done">0</strong><span id="planned"></span>
        <span class="ok" id="new"></span>
        <span id="updated"></span>
        <span class="warn" id="skipped"></span>
        <span class="warn" id="failed"></span>
      </p>
      <p class="pace" id="pace"></p>
      <button id="retry" class="ghost retry" hidden>Retry failed</button>
    </section>

    <p id="note" class="note" hidden></p>

    <p class="foot">
      Keep the store tab in front while it scrolls. Then the pieces open one by one in the
      background, at the pace the store asks for. robots.txt is obeyed.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
